# Pull request review by Claude: the only reviewer (Cursor Bugbot was retired on 2026-10-16).
#
# The review itself is gorfednet/.github's shared claude-review.yml. It runs when a pull request
# opens or leaves draft, and again on a "claude review" comment. Merge gate:
#   node <gorfednet/.github clone>/scripts/review-status.mjs --pr <n> --repo gorfednet/<repository>
# House rules for the reviewer: REVIEW.md at the repository root.
name: claude-review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: gorfednet/.github/.github/workflows/claude-review.yml@main
    with:
      runs-on: ${{ vars.HEAVY_RUNS_ON }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
