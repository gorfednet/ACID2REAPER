# Push a version tag (v*.*.*) to run tests, build the PyPI sdist/wheel, attach them to a
# GitHub Release, and publish to PyPI via trusted publishing (OIDC — no long-lived token).
# Tag naming: see RELEASING.md (e.g. v1.0.0 or v0.2.0-beta.1).
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Verify changelog
        run: python scripts/verify_changelog.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: "Preflight: verify PyPI OIDC token access"
        if: github.repository == 'gorfednet/ACID2REAPER'
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::PyPI must have a pending publisher for gorfednet/ACID2REAPER, workflow release.yml, with no environment name."
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub OIDC is unavailable. Keep 'permissions: id-token: write' on this workflow."
            exit 1
          fi
          if ! curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" |
            python -c "import json,sys; assert json.load(sys.stdin).get('value'), 'OIDC response has no token'"; then
            echo "::error::Could not mint the PyPI OIDC token. Do not create a release tag until trusted publishing is configured."
            exit 1
          fi
          echo "::notice::GitHub OIDC token minted. PyPI will now validate the pending-publisher configuration."

      - name: Publish to PyPI
        # Configure this first: https://pypi.org/manage/project/acid2reaper/settings/publishing/
        # Pending publisher: gorfednet/ACID2REAPER, release.yml, environment left blank.
        if: github.repository == 'gorfednet/ACID2REAPER'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish GitHub Release (assets + notes)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
